<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maxi Servicios - Pi Store</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        :root {
            --pi-purple: #674ea7;
            --pi-gold: #ffa500;
            --white: #ffffff;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f4f4f4; }
        header { background-color: var(--pi-purple); color: var(--white); padding: 20px; text-align: center; border-bottom: 4px solid var(--pi-gold); }
        
        .login-section { text-align: center; padding: 20px; }
        .btn-pi { background-color: var(--pi-gold); color: white; border: none; padding: 12px 25px; border-radius: 25px; font-weight: bold; cursor: pointer; font-size: 1.1em; }

        .section-title { padding: 15px; color: var(--pi-purple); border-left: 5px solid var(--pi-gold); margin: 20px; background: white; }
        
        /* Categorías Grid */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; padding: 20px; }
        .card { background: white; border-radius: 8px; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); transition: 0.3s; cursor: pointer; text-decoration: none; color: #333; }
        .card:hover { transform: translateY(-5px); border: 1px solid var(--pi-purple); }
        .card i { font-size: 2em; color: var(--pi-purple); }

        /* Productos */
        .products-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; padding: 20px; }
        .product-card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .product-info { padding: 15px; }
        .price { color: var(--pi-purple); font-weight: bold; font-size: 1.2em; }
        .buy-button { width: 100%; background: var(--pi-purple); color: white; border: none; padding: 10px; margin-top: 10px; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>

<header>
    <h1>MAXI SERVICIOS</h1>
    <p>Tecnología y Servicios Digitales en Colombia</p>
</header>

<div class="login-section">
    <button id="pi-login" class="btn-pi" onclick="loginWithPi()">Iniciar Sesión con Pi Network</button>
    <p id="user-info"></p>
</div>

<h2 class="section-title">Categorías Principales</h2>
<div class="grid-container">
    <a href="https://maxiservicios.cercia.co/categorias/telefonia-celular" class="card">📱<br>Telefonía</a>
    <a href="https://maxiservicios.cercia.co/categorias/accesorios-ps5" class="card">🎮<br>Accesorios PS5</a>
    <a href="https://maxiservicios.cercia.co/categorias/pines-electronicos" class="card">🎟️<br>Pines Electrónicos</a>
    <a href="https://maxiservicios.cercia.co/categorias/corresponsal" class="card">🏦<br>Corresponsal</a>
    <a href="https://maxiservicios.cercia.co/categorias/apuestas-deportivas" class="card">⚽<br>Apuestas</a>
    <a href="https://maxiservicios.cercia.co/categorias/soat" class="card">🚗<br>SOAT</a>
</div>

<h2 class="section-title">Productos Destacados</h2>
<div class="products-container" id="product-list">
    <!-- El contenido se cargaría dinámicamente o se enlaza directamente -->
    <div class="product-card">
        <div class="product-info">
            <h3>Producto Tecnológico</h3>
            <p>Descripción breve del servicio o producto digital.</p>
            <p class="price">0.005 π</p>
            <button class="buy-button" onclick="transferPi(0.005, 'Compra Producto')">Pagar con Pi</button>
        </div>
    </div>
</div>

<script>
    const Pi = window.Pi;
    Pi.init({ version: "2.0", sandbox: true }); // Cambiar sandbox a false en producción

    async function loginWithPi() {
        try {
            const scopes = ['username', 'payments'];
            const auth = await Pi.authenticate(scopes, onIncompletePaymentFound);
            document.getElementById('user-info').innerText = "Bienvenido, " + auth.user.username;
            document.getElementById('pi-login').style.display = 'none';
        } catch (err) {
            console.error(err);
        }
    }

    function onIncompletePaymentFound(payment) {
        console.log("Pago incompleto detectado", payment);
    }

    async function transferPi(amount, memo) {
        try {
            const payment = await Pi.createPayment({
                amount: amount,
                memo: memo,
                metadata: { orderId: "12345" },
            }, {
                onReadyForServerApproval: (paymentId) => { /* Enviar al backend para aprobar */ },
                onReadyForServerCompletion: (paymentId, txid) => { /* Finalizar en backend */ },
                onCancel: (paymentId) => { console.log("Cancelado"); },
                onError: (error, payment) => { console.error(error); },
            });
        } catch (err) {
            console.error(err);
        }
    }
</script>

</body>
</html>
